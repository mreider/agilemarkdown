name: CI

on:
  push:
    branches: [master]
    tags:
      - 'vscode-v*'
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  fixture-smoke:
    name: Fixture + demo build
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build am
        run: |
          go build -o $HOME/go/bin/am .
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: run fixture build
        run: bash tests/fixtures/build-sample.sh /tmp/am-fixture
      - name: assert fixture shape
        run: |
          test -d /tmp/am-fixture/stories
          test -f /tmp/am-fixture/.am/config.yaml
          test -f /tmp/am-fixture/.am/inception.md
          # 54 stories expected (excluding _priority.md, _icebox.md, archive.md).
          count=$(ls /tmp/am-fixture/stories/*.md | grep -vE "_(priority|icebox)|archive" | wc -l | tr -d ' ')
          if [ "$count" -ne 54 ]; then echo "fail: expected 54 stories, got $count"; exit 1; fi
      - name: run build-demo script (jq smoke checks)
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          bash scripts/build-demo.sh /tmp/am-demo

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode/package-lock.json
      # Go is needed so the extension's bus test can drive a real `am`
      # binary instead of skipping. The component tests do not need it,
      # but the phantom-file regression in extension-bus.test.ts does.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build am
        run: go build -o agilemarkdown .
      - run: npm ci
        working-directory: vscode
      - name: typecheck
        run: npx tsc --noEmit
        working-directory: vscode
      - name: vitest
        run: npm test
        working-directory: vscode
      - name: webpack build
        run: npm run build
        working-directory: vscode
      - name: package vsix
        run: npx vsce package --allow-missing-repository
        working-directory: vscode
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix

  publish:
    name: Publish (tag only)
    needs: [go-test, fixture-smoke, vscode]
    if: startsWith(github.ref, 'refs/tags/vscode-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - run: npm run build
        working-directory: vscode
      - run: npx vsce package --allow-missing-repository
        working-directory: vscode
      - name: Publish to VS Code Marketplace (skipped if VSCE_PAT secret is empty)
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix -p $VSCE_PAT
        working-directory: vscode
      - name: Publish to Open VSX (skipped if OVSX_PAT secret is empty)
        if: env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix -p $OVSX_PAT
        working-directory: vscode
      - name: Attach VSIX to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # release.yml's create-release job runs in parallel on the same
        # v* tag and is responsible for creating the GitHub release. Wait
        # for it to land (up to ~1 min), then upload the VSIX. --clobber
        # makes a rerun idempotent.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            echo "release $GITHUB_REF_NAME not yet visible (attempt $attempt), sleeping 10s…"
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" vscode/*.vsix --repo "$REPO" --clobber
